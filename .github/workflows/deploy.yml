name: Deploy to EC2

# Push-to-deploy: every push to main (or a manual run) typechecks, then SSHes
# into the EC2 box and runs deploy/deploy.sh (git reset → rebuild → restart).
# Docs-only pushes (README, case study) skip the deploy — nothing runtime changed.
# Use the Actions tab / `gh workflow run` to force a deploy for those anyway.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'case-study/**'
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Gate: a broken frontend build never reaches the server.
      - name: Typecheck frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Deploy over SSH (runs deploy.sh on the box)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            ec2-user@"$EC2_HOST" 'cd ~/Fluxus_Fisci && git fetch origin && git reset --hard origin/main && bash deploy/deploy.sh'
